/* ---------- Dibujos nuevos B (viewBox -62 -62 124 124) ---------- */
const PB_f=n=>(Math.round(n*10)/10).toString();
const PB_ell=(cx,cy,rx,ry,a0,a1,n)=>{const p=[];for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return p};
/* bumpy edge through pts (bumps bulge away from cx,cy); returns path commands without the initial M */
const PB_scal=(pts,cx,cy,k=.45)=>{let d='';for(let i=1;i<pts.length;i++){const[a,b]=pts[i-1],[c,e]=pts[i];const mx=(a+c)/2,my=(b+e)/2,dx=c-a,dy=e-b,L=Math.hypot(dx,dy)||1;let nx=dy/L,ny=-dx/L;if(nx*(mx-cx)+ny*(my-cy)<0){nx=-nx;ny=-ny}d+=`Q${PB_f(mx+nx*L*k)} ${PB_f(my+ny*L*k)} ${PB_f(c)} ${PB_f(e)} `}return d};
const PB_M=p=>`M${PB_f(p[0])} ${PB_f(p[1])} `;
/* spiky outline: alternate tips/valleys along an ellipse arc */
const PB_spk=(cx,cy,rx,ry,a0,a1,n,f=.8)=>{const p=[];for(let i=0;i<=2*n;i++){const a=(a0+(a1-a0)*i/(2*n))*Math.PI/180,r=i%2?1:f;p.push(`${PB_f(cx+Math.cos(a)*rx*r)} ${PB_f(cy+Math.sin(a)*ry*r)}`)}return p};
/* parallel lines inside an ellipse (no clipping needed) */
const PB_hatch=(cx,cy,rx,ry,step,deg)=>{const a=deg*Math.PI/180,ux=Math.cos(a),uy=Math.sin(a),nx=-uy,ny=ux,R=Math.max(rx,ry);let d='';for(let o=-R+step/2;o<R;o+=step){const px=nx*o,py=ny*o,A=ux*ux/rx/rx+uy*uy/ry/ry,B=2*(px*ux/rx/rx+py*uy/ry/ry),C=px*px/rx/rx+py*py/ry/ry-1,D=B*B-4*A*C;if(D<=0)continue;const t1=(-B-Math.sqrt(D))/2/A,t2=(-B+Math.sqrt(D))/2/A;d+=`M${PB_f(cx+px+t1*ux)} ${PB_f(cy+py+t1*uy)} L${PB_f(cx+px+t2*ux)} ${PB_f(cy+py+t2*uy)} `}return d};

const PD_burst=(cx,cy,r,n,c1,c2,rot=0)=>{let a='',b='';for(let i=0;i<n;i++){const t=rot+i*2*Math.PI/n,x1=cx+Math.cos(t)*r*.32,y1=cy+Math.sin(t)*r*.32,x2=cx+Math.cos(t)*r*.8,y2=cy+Math.sin(t)*r*.8;a+=`M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)} `;b+=`<circle cx="${(cx+Math.cos(t)*r*.92).toFixed(1)}" cy="${(cy+Math.sin(t)*r*.92).toFixed(1)}" r="${(r*.1).toFixed(1)}" fill="${i%2?c2:c1}" ${sw(2.5)}/>`}return `<path d="${a}" stroke="${K}" stroke-width="${(r*.17+4).toFixed(1)}" stroke-linecap="round"/><path d="${a}" stroke="${c1}" stroke-width="${(r*.17).toFixed(1)}" stroke-linecap="round"/>${b}<circle cx="${cx}" cy="${cy}" r="${(r*.16).toFixed(1)}" fill="${c2}" ${sw(3)}/>`};
const PD_curl=(x0,y0,x1,y1,r,loops,c)=>{let d='';const N=80;for(let i=0;i<=N;i++){const t=i/N,k=t*loops*2*Math.PI;const x=x0+(x1-x0)*t+r*Math.sin(k),y=y0+(y1-y0)*t-r*Math.cos(k)+r;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '}return `<path d="${d}" fill="none" stroke="${K}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`};

/* ---------- Dibujos de la tienda de Tito (prefijo PE_) ---------- */
const PE_star=(cx,cy,R,r=R*.5,n=5)=>{const p=[];for(let i=0;i<2*n;i++){const a=-Math.PI/2+i*Math.PI/n,q=i%2?r:R;p.push((cx+q*Math.cos(a)).toFixed(1)+','+(cy+q*Math.sin(a)).toFixed(1))}return p.join(' ')};
/* moneda de frente: disco dorado, borde oscuro, estrella en relieve, brillo */
const PE_coin=(x,y,R,o=5)=>{const k=R/54,f=v=>(v*k).toFixed(1);
return `<g transform="translate(${x} ${y})"><circle r="${R}" fill="#F2A93B" ${sw(o)}/><circle r="${f(40)}" fill="#FFC93C" stroke="#D88A1E" stroke-width="${Math.max(1.5,3.5*k).toFixed(1)}"/><polygon points="${PE_star(2.5*k,3*k,28*k,13.5*k)}" fill="#E39A22"/><polygon points="${PE_star(0,0,28*k,13.5*k)}" fill="#FFE08A" stroke="#D88A1E" stroke-width="${Math.max(1.2,2.5*k).toFixed(1)}" stroke-linejoin="round"/><ellipse cx="${f(-33)}" cy="${f(-33)}" rx="${f(5)}" ry="${f(12)}" transform="rotate(45 ${f(-33)} ${f(-33)})" fill="#FFFFFF" opacity=".85"/><circle cx="${f(-45)}" cy="${f(-14)}" r="${f(3.5)}" fill="#FFFFFF" opacity=".85"/></g>`};
/* moneda de canto, para pilas: x centro, y base */
const PE_flat=(x,y,rx,ry,h,o=4)=>`<path d="M${x-rx} ${y-h} V${y} A${rx} ${ry} 0 0 0 ${x+rx} ${y} V${y-h} Z" fill="#E8A92A" ${sw(o)}/><ellipse cx="${x}" cy="${y-h}" rx="${rx}" ry="${ry}" fill="#FFC93C" ${sw(o)}/>`;
const PE_pile=(x,y,n,rx=26,ry=9,h=10)=>{let s='';for(let i=0;i<n;i++)s+=PE_flat(x,y-i*h,rx,ry,h);const t=y-n*h;return s+`<ellipse cx="${x}" cy="${t}" rx="${rx*.55}" ry="${ry*.5}" fill="#FFE08A"/>`};
const PE_book=(x,y,w,h,c)=>`<rect x="${x}" y="${y-h}" width="${w}" height="${h}" rx="1.5" fill="${c}" ${sw(3)}/><path d="M${x+2} ${y-h+5} h${w-4}" stroke="#FFFFFF" stroke-width="2.5" opacity=".7"/>`;

const PE_bar=(x1,y1,x2,y2,w,c,o=4)=>{const L=Math.hypot(x2-x1,y2-y1),a=Math.atan2(y2-y1,x2-x1)*180/Math.PI-90;return `<rect x="${-w/2}" y="${-w/2}" width="${w}" height="${(L+w).toFixed(1)}" rx="${w/2}" fill="${c}" ${sw(o)} transform="translate(${x1} ${y1}) rotate(${a.toFixed(1)})"/>`};
/* pelota de playa: gajos proyectados de una esfera inclinada hacia quien mira */
const PE_beach=(R,al,cols)=>{const a=al*Math.PI/180,n=cols.length,f=v=>v.toFixed(1);
const P=(lat,lon)=>{const x=Math.cos(lat)*Math.sin(lon),y=-Math.sin(lat),z=Math.cos(lat)*Math.cos(lon);return f(x*R)+','+f((y*Math.cos(a)+z*Math.sin(a))*R)};
const end=th=>Math.atan(-Math.cos(th)/Math.tan(a));
const mer=(th,down)=>{const e=end(th),q=[];for(let i=0;i<=24;i++){const t=down?i/24:1-i/24;q.push(P(Math.PI/2-(Math.PI/2-e)*t,th))}return q};
let s='';for(let k=0;k<n;k++){const l1=k*2*Math.PI/n+.3,l2=(k+1)*2*Math.PI/n+.3,pts=mer(l1,true);for(let i=1;i<24;i++){const th=l1+(l2-l1)*i/24;pts.push(P(end(th),th))}s+=`<polygon points="${pts.concat(mer(l2,false)).join(' ')}" fill="${cols[k]}"/>`}
const c75=Math.cos(75*Math.PI/180);
return s+`<ellipse cx="0" cy="${f(-R*Math.sin(75*Math.PI/180)*Math.cos(a))}" rx="${f(R*c75)}" ry="${f(R*c75*Math.sin(a))}" fill="#FFFFFF" ${sw(3)}/><circle r="${R}" fill="none" ${sw()}/>`};

/* recorte de un poligono por otro convexo (Sutherland-Hodgman) */
const PE_clip=(sub,clip)=>{let out=sub;for(let i=0;i<clip.length;i++){const A=clip[i],B=clip[(i+1)%clip.length],inn=p=>(B[0]-A[0])*(p[1]-A[1])-(B[1]-A[1])*(p[0]-A[0])>=0,X=(p,q)=>{const a1=B[1]-A[1],b1=A[0]-B[0],c1=a1*A[0]+b1*A[1],a2=q[1]-p[1],b2=p[0]-q[0],c2=a2*p[0]+b2*p[1],d=a1*b2-a2*b1;return[(b2*c1-b1*c2)/d,(a1*c2-a2*c1)/d]};const inp=out;out=[];for(let j=0;j<inp.length;j++){const P=inp[j],Q=inp[(j+1)%inp.length];if(inn(Q)){if(!inn(P))out.push(X(P,Q));out.push(Q)}else if(inn(P))out.push(X(P,Q))}}return out.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')};

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, dist=(a,b,c,d)=>Math.hypot(a-c,b-d);

function col(c,s){ // mezcla un color hacia su gris (s=1 color pleno, 0 gris)
  if(s>=.999)return c; const k=c+'|'+s.toFixed(2); if(_cc[k])return _cc[k];
  const [r,g,b]=hex2(c), l=r*.3+g*.59+b*.11, m=v=>Math.round(clamp(l*.85+40+(v-(l*.85+40))*s,0,255));

  const est=900+t.length*85/(o.rate||1);

    u.rate=o.rate||.9; u.pitch=o.pitch||1.1; u.volume=S.vol.voz; u.onend=fin; u.onerror=fin;

/* ---------- elegir dibujo ---------- */
function layoutChoice(ws,ok,y,big){
  const n=ws.length,s=big?(n<=2?320:n===3?290:250):(n<=2?280:n===3?250:220),gap=44,tot=n*s+(n-1)*gap,x0=Math.max(300+s/2,900-tot/2+s/2);

}
function drawChoice(items){
  for(const it of items){
    let a=1; if(it.gone){a=Math.max(0,1-(T-it.gone)*2);if(a<=0)continue}
    const ap=clamp((T-it.in)*3,0,1),hs=(it.win||it.gone)?1:hv(it,hR(it.x,it.y,it.s,it.s)),sc=(ap<1?back(ap):1+(it.win?Math.sin((T-it.win)*10)*.04:0))*hs,sx=it.shake>0?Math.sin((T-it.shake)*40)*14*Math.max(0,1-(T-it.shake)*2.5):0;
    ctx.save();ctx.globalAlpha=a;ctx.translate(it.x+sx,it.y);ctx.scale(sc,sc);
    card(-it.s/2,-it.s/2,it.s,it.s,it.bg||'#fff',it.win?12:7,40,it.win?'#FFC93C':K);thing(it.w,0,0,it.s*.78);
    ctx.restore();
  }
}
const hitItem=(items,x,y)=>items.find(it=>!it.gone&&Math.abs(x-it.x)<it.s/2+10&&Math.abs(y-it.y)<it.s/2+10);
function ChoiceGame(cfg,onDone){
  return {total:cfg.rounds,done:0,i:0,
    enter(){this.round()},
    round(){this.r=cfg.gen(this.i);this.items=layoutChoice(shuffle(this.r.words),this.r.ok,cfg.y||600,cfg.big);this.errs=0;this.lock=true;this.busy=false;
      later(400,()=>{this.r.snd&&this.r.snd();say(this.r.ask,()=>{this.lock=false})});later(2600,()=>{this.lock=false})},
    prompt(){this.r.snd&&this.r.snd();say(this.r.ask)},
    hint(){const it=this.items.find(i=>i.ok&&!i.win);return it?{x:it.x,y:it.y,r:it.s*.62}:null},
    draw(){cfg.bg();cfg.ref&&cfg.ref(this.r,this);drawChoice(this.items)},
    down(x,y){
      if(cfg.refTap&&cfg.refTap(this,x,y))return;
      const it=hitItem(this.items,x,y); if(!it){SFX.tap();sparkles(x,y,3);return}
      if(it.win||this.busy)return; if(this.lock&&!it.ok){say(cap(nameT(it.w)));return}
      if(it.ok){this.busy=true;it.win=T;SFX.good();burst(it.x,it.y,30);rec(cfg.key(this.r),this.errs===0);onRight(this.errs===0);this.done++;scene.starPop=T;
        say(this.r.okSay(it.w),()=>later(450,()=>{this.i++;if(this.i>=cfg.rounds)onDone();else this.round()}))}
      else{SFX.bad();it.shake=T;if(this.errs===0)rec(cfg.key(this.r),false);this.errs++;say(this.r.badSay(it.w));
        if(this.errs===2){onWrongTwice();const w=this.items.find(i=>!i.ok&&!i.gone&&i!==it);if(w&&this.items.filter(i=>!i.gone&&!i.ok).length>1)w.gone=T}}
    }
  };
}
// "¿Dónde está...?" con una lista de dibujos
function Busca(cfg,onDone){

  return ChoiceGame({rounds:R,bg:cfg.bg,key:()=>cfg.key||'busca',y:600,big:true,
    gen(i){const t=order[i%order.length];const n=Math.min(nOpts(),pool.length);const others=shuffle(pool.filter(w=>w!==t)).slice(0,n-1);
      return {words:[t,...others],ok:[t],ask:cfg.ask?cfg.ask(t):esta(t),snd:cfg.sound&&SOUNDS[t]?()=>playSound(t):null,
        okSay:w=>praise()+' '+(cfg.okSay?cfg.okSay(w):cap(nameT(w))+'.'),badSay:w=>eseEs(w)+'. '+(cfg.ask?cfg.ask(t):esta(t))}}},onDone);
}

/* ---------- conocer: tarjetas con voz ---------- */
function Conocer(cfg,onDone){

  const cols=n<=3?n:n===4?4:n<=6?3:n<=8?4:5, rows=Math.ceil(n/cols), s=Math.min(1220/cols-34,660/rows-34,290);
  items.forEach((it,i)=>{const r=Math.floor(i/cols),c=i%cols,inRow=Math.min(cols,n-r*cols);it.x=900-(inRow-1)*(s+34)/2+c*(s+34);it.y=180+((660-rows*(s+34))/2)+(s+34)/2+r*(s+34);it.s=s;it.in=T+i*.08});
  return {total:n,done:0,open:null,
    enter(){later(300,()=>say(cfg.intro||'Tocá cada dibujo para conocerlo.'))},
    prompt(){say(this.open?'Tocá para cerrar.':'Tocá un dibujo que todavía no tenga estrella.')},
    hint(){if(this.open)return{x:900,y:450,r:200};const it=items.find(i=>!i.seen);return it?{x:it.x,y:it.y,r:s*.6}:null},
    show(it){this.open=it;this.ot=T;SFX.pop();if(it.snd||SOUNDS[it.k])later(250,()=>(it.snd||(()=>playSound(it.k)))());
      const line=it.say?V(it.say):(cap(nameT(it.k||it))+'.');
      later(it.snd||SOUNDS[it.k]?900:200,()=>say(line,()=>{this.spoke=T}));
      if(!it.seen){it.seen=T;this.done++;scene.starPop=T}},
    close(){this.open=null;this.spoke=0;SFX.tap();if(this.done>=n&&!this.fin){this.fin=true;later(400,onDone)}},
    update(){if(this.open&&this.spoke&&T-this.spoke>2.2)this.close()},
    draw(){cfg.bg();
      for(const it of items){const ap=clamp((T-it.in)*3,0,1),hs=this.open?1:hv(it,hR(it.x,it.y,it.s,it.s));ctx.save();ctx.translate(it.x,it.y);ctx.scale((ap<1?back(ap):1)*hs,(ap<1?back(ap):1)*hs);
        card(-it.s/2,-it.s/2,it.s,it.s,it.bg||'#fff',7,36);if(it.draw)it.draw(0,0,it.s*.8);else thing(it.k,0,0,it.s*.8);
        if(it.seen)star(it.s/2-18,-it.s/2+18,22,'#FFC93C',3.5);ctx.restore()}

        ctx.save();ctx.translate(900,430);ctx.scale(back(k),back(k));card(-260,-280,520,560,'#FFF6E6',8,50);

        const lb=(it.label?V(it.label):Wn(it.k||'')).toUpperCase();text(lb,0,230,lb.length>12?50:64,K,{f:LF});
        if(it.ex)it.ex.forEach((e,j)=>{card(-250+j*180,300,140,140,'#fff',5,28);pic(e,-180+j*180,370,115)});

/* ---------- el cuerpo: tocar partes ---------- */

Object.assign(KID_C,{cuello:[0,-410],hombros:[76,-372],codos:[112,-293],rodillas:[43,-100],tobillos:[43,-36]});
function kidFineAt(px,py,x,y,s){const u=(px-x)/s,v=(py-y)/s,ax=Math.abs(u);

    prompt(){if(free)say('Tocá una parte del cuerpo.');else say('Tocá '+V(this.t.n)+'.')},

    draw(){cfg.bg();drawKid(kx,ky,ks,{hl:T-this.hlT<1.4?this.hl:null,skin:cfg.skin,hair:cfg.hair});

      if(this.hl&&T-this.hlT<1.4){const p=ALL.find(q=>q.id===this.hl);if(KID_FINE.includes(p)){const [a,b]=KID_C[p.id];ctx.globalAlpha=.55;circ(kx+a*ks,ky+b*ks,46,null,10,'#FFC93C');circ(kx-a*ks,ky+b*ks,46,null,10,'#FFC93C');ctx.globalAlpha=1}text(Wn(V(p.n)).toUpperCase(),520,360,72,K,{f:LF})}},

    turn(){if(this.pi<P.length-1){SFX.whoosh();this.page(this.pi+1)}else this.quiz(0)},
    quiz(i){this.ph='quiz';this.qi=i;const q=Q[i];if(!q){this.ph='end';onDone();return}this.errs=0;this.busy=false;

        card(560,22,480,80,'#FFFBF2',5,40);pic('libro',620,62,64);text(V(data.title),830,76,V(data.title).length>24?28:34,K,{w:600})}
      else{const p=P[Math.min(P.length-1,this.qi)];ctx.save();(BG[P[0].bg]||BG.conceptos)();ctx.restore();ctx.fillStyle='rgba(255,246,230,.6)';ctx.fillRect(0,0,W,H);
        card(330,110,940,280,'#fff',6,36);pic('libro',440,250,140);text('?',1170,310,160,'#FFA94D',{f:LF,st:8,sc:'#fff'});
        text(V(data.title),800,250,V(data.title).length>24?44:54,K,{w:600});
        if(this.items)drawChoice(this.items)}},
    down(x,y){if(this.ph==='read'){if(dist(x,y,1470,470)<80){if(this.said||T-this.pT>1.5){SFX.tap();try{speechSynthesis.cancel()}catch(e){}sceneTokBump();this.turn()}}return}
      if(this.ph!=='quiz')return;const it=hitItem(this.items,x,y);if(!it){SFX.tap();return}if(it.win||this.busy)return;const q=Q[this.qi];
      if(it.ok){this.busy=true;it.win=T;SFX.good();burst(it.x,it.y,30);rec('cuentos',this.errs===0);onRight(this.errs===0);this.done++;scene.starPop=T;
        say(praise()+' '+V(q.okSay||''),()=>later(400,()=>this.quiz(this.qi+1)))}
      else{SFX.bad();it.shake=T;if(this.errs===0)rec('cuentos',false);this.errs++;say(V(['Mmm, no. Pensá en el cuento. ','Mmm, no. Piensa en el cuento. '])+V(q.q));
        if(this.errs===2){const w=this.items.find(i=>!i.ok&&!i.gone&&i!==it);if(w&&this.items.filter(i=>!i.gone&&!i.ok).length>1)w.gone=T}}}
  };
}

function sayMix(parts,cb){const P=parts.filter(Boolean);const step=i=>{if(i>=P.length){cb&&cb();return}const p=P[i],en=p[0]==='@';say(en?p.slice(1):p,()=>step(i+1),en?{en:1,rate:.8}:{})};step(0)}

function enBlob(c){return (x,y,s)=>{ctx.save();ctx.translate(x,y);const r=s*.34;ctx.beginPath();for(let i=0;i<=24;i++){const a=i/24*PI*2,q=r*(1+.12*Math.sin(a*5));ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q)}ctx.closePath();fillStroke(c,Math.max(4,s*.03));
  for(const [a,b,q] of[[.95,-.6,.12],[-.9,.7,.09],[.7,.85,.07]])circ(a*r,b*r,q*s,c,Math.max(3,s*.02));ctx.restore()}}
function enNum(n){return (x,y,s)=>{ctx.save();ctx.translate(x,y);circ(0,-s*.06,s*.3,DIAC[(n-1)%7],Math.max(4,s*.03));text(String(n),0,s*.06,s*.34,'#fff',{f:LF,st:Math.max(4,s*.03),sc:K});
  const per=5,rows=Math.ceil(n/per);for(let i=0;i<n;i++){const r=Math.floor(i/per),c=i%per,inRow=Math.min(per,n-r*per);circ((c-(inRow-1)/2)*s*.12,s*.33+r*s*.1,s*.04,'#FFC93C',Math.max(2,s*.012))}ctx.restore()}}

function enCard(it,x,y,s,o={}){const hs=o.s||1,sh=o.shake?Math.sin((T-o.shake)*40)*10*Math.max(0,1-(T-o.shake)*2.5):0;ctx.save();ctx.translate(x+sh,y);ctx.scale(hs,hs);
  if(o.glow){ctx.globalAlpha=.5;circ(0,0,s*.62,'#FFE08A',0);ctx.globalAlpha=1}card(-s/2,-s/2,s,s,o.bg||'#fff',7,36);enDraw(it,0,o.label?-s*.07:0,s*(o.label?.66:.8));
  if(o.label){ctx.font=`600 ${Math.round(s*.13)}px ${DF}`;text(it.en,0,s*.42,Math.min(s*.13,s*.85/Math.max(1,ctx.measureText(it.en).width/(s*.13))),K,{w:600})}
  if(o.star)star(s/2-18,-s/2+18,22,'#FFC93C',3.5);ctx.restore()}
function enGrid(items,top=180,h=660,w=1220,cx=900){const n=items.length,cols=n<=3?n:n===4?4:n<=6?3:n<=8?4:5,rows=Math.ceil(n/cols),s=Math.min(w/cols-34,h/rows-34,290);
  items.forEach((it,i)=>{const r=Math.floor(i/cols),c=i%cols,inRow=Math.min(cols,n-r*cols);it.x=cx-(inRow-1)*(s+34)/2+c*(s+34);it.y=top+((h-rows*(s+34))/2)+(s+34)/2+r*(s+34);it.s=s;it.in=T+i*.08})}

// 1) Escuchá y repetí: tocar cada dibujo para oír la palabra en inglés
function EnConocer(cfg,onDone){const items=cfg.items.map(o=>Object.assign({},o));enGrid(items);const n=items.length;
  return {total:n,done:0,open:null,
    enter(){later(300,()=>say(cfg.intro||'Tocá cada dibujo y escuchá cómo se dice en inglés. ¡Repetilo en voz alta!'))},
    prompt(){say(this.open?'Tocá para cerrar.':'Tocá un dibujo que todavía no tenga estrella.')},
    hint(){if(this.open)return this.spoke?{x:900,y:450,r:200}:null;const it=items.find(i=>!i.seen);return it?{x:it.x,y:it.y,r:it.s*.6}:null},
    show(it){this.open=it;this.ot=T;this.spoke=0;SFX.pop();later(200,()=>sayMix(['@'+it.en,enEs(it)+'.','@'+it.en],()=>{this.spoke=T}));if(!it.seen){it.seen=T;this.done++;scene.starPop=T}},
    close(){this.open=null;SFX.tap();if(this.done>=n&&!this.fin){this.fin=true;later(400,onDone)}},
    update(){if(this.open&&this.spoke&&T-this.spoke>2.2)this.close()},
    draw(){cfg.bg();for(const it of items){const ap=clamp((T-it.in)*3,0,1);enCard(it,it.x,it.y,it.s,{s:(ap<1?back(ap):1)*(this.open?1:hv(it,hR(it.x,it.y,it.s,it.s))),star:it.seen,bg:it.col==='#FFFFFF'?'#E9F3FA':null})}
      if(this.open){const it=this.open,k=clamp((T-this.ot)*4,0,1);ctx.fillStyle=`rgba(46,36,32,${.45*k})`;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(900,430);ctx.scale(back(k),back(k));
        card(-280,-290,560,580,it.col==='#FFFFFF'?'#E9F3FA':'#FFF6E6',8,50);enDraw(it,0,-60,330);text(it.en.toUpperCase(),0,190,it.en.length>9?60:76,'#5B8DEF',{f:LF});text(enEs(it),0,252,40,'#7A6252');ctx.restore()}},
    down(x,y){if(this.open){if(this.spoke||T-this.ot>4)this.close();return}const it=items.find(i=>inR(x,y,i.x,i.y,i.s,i.s));if(it)this.show(it);else{SFX.tap();sparkles(x,y,3)}}}}

// 2) ¿Dónde está? Tito dice la palabra en inglés y hay que tocar el dibujo
function EnEscucha(cfg,onDone){const pool=cfg.items,R=cfg.rounds||Math.min(nRounds(),pool.length+1);let order=shuffle(pool.slice());
  return {total:R,done:0,i:0,
    enter(){this.round()},
    round(){const t=order[this.i%order.length],n=clamp(nOpts()+1,3,Math.min(4,pool.length)),others=shuffle(pool.filter(w=>w!==t)).slice(0,n-1);
      this.t=t;this.items=shuffle([t,...others]).map(o=>({it:o,ok:o===t}));enGrid(this.items,240,560,1200);this.errs=0;this.busy=false;this.lock=true;
      later(400,()=>this.prompt(()=>{this.lock=false}));later(2800,()=>{this.lock=false})},
    prompt(cb){sayMix(['Tocá','@'+this.t.en],cb)},
    hint(){const c=this.items.find(c=>c.ok&&!c.win);return c&&!this.lock?{x:c.x,y:c.y,r:c.s*.6}:null},

const started=t=>{const s=tst(t.id);return !!s.done||Object.keys(s.g).length>0};
function temaOpen(t){if(!t)return false;if(S.unlockAll||started(t))return true;const z=t.zone;
  if(MAINZ.includes(z)){if(!zoneOpen(z))return false;if(t.concepts)return pathDone(z)>=NEED.concepts;const L=pathOf(z),i=L.indexOf(t);return i<=0||!!tst(L[i-1].id).done}
  if(z==='fiestas'||z==='ingles'){if(mainDone()<NEED[z])return false;const L=ZONES[z].temas,i=L.indexOf(t);return i<=0||!!tst(L[i-1].id).done||fiestaNow()===t.id}
  if(NEED[t.id]!=null)return mainDone()>=NEED[t.id];
  return true}

  const t=pathOf(z).find(t=>!tst(t.id).done&&temaOpen(t));if(t)return t;const c=ZONES[z].temas.find(t=>t.concepts);return c&&!tst(c.id).done&&temaOpen(c)?c:null}
function nextTema(){const z0=ageZoneOpen();
  for(const z of[z0,...MAINZ.filter(z=>z!==z0)]){if(!zoneOpen(z))continue;const t=pathOf(z).find(t=>!tst(t.id).done&&temaOpen(t));if(t)return t}
  for(const t of[CAN,RUT,...ING,TRZ,...MAINZ.map(z=>ZONES[z].temas.find(t=>t.concepts)),...FIESTAS])if(t&&!tst(t.id).done&&temaOpen(t))return t;
  return null}

function roadPath(pts,o){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];
  if(Math.abs(a[1]-b[1])<6)ctx.lineTo(b[0],b[1]);else{const sd=(a[0]+b[0])/2>800?1:-1;ctx.bezierCurveTo(a[0]+sd*o,a[1],b[0]+sd*o,b[1],b[0],b[1])}}}

  roadPath(pts,o);ctx.lineWidth=60;ctx.strokeStyle='#D9C49A';ctx.stroke();ctx.lineWidth=48;ctx.strokeStyle='#FFF6E0';ctx.stroke();
  if(upto>0){roadPath(pts.slice(0,upto+1),o);ctx.lineWidth=48;ctx.strokeStyle='#FFE08A';ctx.stroke()}
  roadPath(pts,o);ctx.lineWidth=7;ctx.setLineDash([3,24]);ctx.strokeStyle='#C9AE7A';ctx.stroke();ctx.setLineDash([]);ctx.restore()}

// Cada habilidad recuerda en qué juegos aparece (S.kg) y cada juego cómo le fue (S.gs).

{const r0=rec;rec=function(k,ok){r0(k,ok);if(sceneName==='juego'&&scene.t&&scene.gi!=null){const id=scene.t.id+'#'+scene.gi,m=S.kg[k]||(S.kg[k]=[]);

{const f0=finishGame;finishGame=function(t,gi){const id=t.id+'#'+gi,g=S.gs[id]||(S.gs[id]={ok:0,err:0,d:''});g.d=today();if(REP_ON&&S.rep&&S.rep.list.includes(id))S.rep.done[id]=1;save();f0(t,gi)}}
const NOREP=['conocer','enConocer','cuento','cancion','trazo','decora','mifamilia','velas'];
const repOk=id=>{const [tid,j]=id.split('#'),t=TEMA[tid],g=t&&t.games[+j];return !!(g&&!NOREP.includes(g.t)&&tst(tid).g[j])};
function repWeak(){const out=[];
  const sk=Object.keys(S.stats).map(k=>{const s=S.stats[k],n=s.ok+s.err;return{k,n,r:n?s.ok/n:1}}).filter(o=>o.n>=4&&o.r<.7).sort((a,b)=>a.r-b.r);
  for(const o of sk)for(const id of(S.kg[o.k]||[]))if(repOk(id)&&!out.includes(id)){out.push(id);break}
  Object.keys(S.gs).map(id=>{const g=S.gs[id],n=g.ok+g.err;return{id,n,r:n?g.ok/n:1}}).filter(o=>o.n>=3&&o.r<.7&&repOk(o.id)).sort((a,b)=>a.r-b.r).forEach(o=>{if(!out.includes(o.id))out.push(o.id)});
  return out}
function repOld(){const L=[];for(const t of TEMAS){const g=tst(t.id).g;for(const j in g){const id=t.id+'#'+j;if(repOk(id))L.push({id,d:(S.gs[id]&&S.gs[id].d)||''})}}
  return L.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).map(o=>o.id)}
function repBuild(){const w=repWeak().slice(0,3),L=[...w],old=repOld(),tm=id=>id.split('#')[0];
  for(const id of old)if(L.length<3&&!L.includes(id)&&!L.some(x=>tm(x)===tm(id)))L.push(id);
  for(const id of old)if(L.length<3&&!L.includes(id))L.push(id);
  S.rep={d:today(),list:L,done:{},weak:w.length,paid:0,seen:0};save()}
function repToday(){const R=S.rep;if(!R||R.d!==today()||(!R.weak&&!Object.keys(R.done).length&&repWeak().length)||(!R.list.length&&repOld().length))repBuild();return S.rep}
const repAllDone=()=>!!(S.rep&&S.rep.d===today()&&S.rep.list.length&&S.rep.list.every(id=>S.rep.done[id]));
